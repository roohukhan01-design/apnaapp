name: Build Roohu ClipForge APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download offline speech models
        run: |
          mkdir -p app/src/main/assets
          cd app/src/main/assets
          curl -fL --retry 3 -o en.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q en.zip && mv vosk-model-small-en-us-0.15 model-en && rm en.zip
          curl -fL --retry 3 -o hi.zip https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip
          unzip -q hi.zip && mv vosk-model-small-hi-0.22 model-hi && rm hi.zip

      - name: Download display fonts
        run: |
          mkdir -p app/src/main/assets/fonts
          cd app/src/main/assets/fonts
          B=https://raw.githubusercontent.com/google/fonts/main/ofl
          get() { curl -fL --retry 3 -o "$2" "$B/$1/$2" || echo "::warning::Could not fetch $2; system font fallback will be used."; }
          get anton Anton-Regular.ttf
          get bebasneue BebasNeue-Regular.ttf
          get bangers Bangers-Regular.ttf
          get archivoblack ArchivoBlack-Regular.ttf
          get poppins Poppins-Black.ttf
          get poppins Poppins-ExtraBold.ttf
          get michroma Michroma-Regular.ttf
          get bungee Bungee-Regular.ttf
          get luckiestguy LuckiestGuy-Regular.ttf
          get russoone RussoOne-Regular.ttf
          get blackopsone BlackOpsOne-Regular.ttf
          get tajawal Tajawal-Black.ttf
          ls -la

      - name: Run JavaScript validation tests
        run: |
          node shared/test/validate.test.js
          node shared/test/projects.test.js
          node shared/test/subtitles.test.js

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Roohu-ClipForge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
